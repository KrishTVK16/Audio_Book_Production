<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Audio Book Production</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap"
        rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Favicon -->
    <link rel="icon" href="assets/logo.png" type="image/png">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 450px;
        }
    </style>
</head>

<body class="bg-light-subtle">

    <div class="auth-container">
        <div class="auth-card card border-0 shadow-lg p-4 p-md-5 rounded-4">
            <div class="text-center mb-4">
                <a class="navbar-brand d-inline-flex align-items-center justify-content-center" href="index.html">
                    <img src="assets/logo.png" alt="AudioStudio">
                    <div class="brand-text text-start">
                        <span class="brand-title">Audio</span>
                        <span class="brand-subtitle">Studio</span>
                    </div>
                </a>
                <p class="text-muted">Join us to start producing your audiobooks.</p>
            </div>

            <form action="dashboard.html">
                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label class="form-label">First Name</label>
                        <input type="text" class="form-control" placeholder="John">
                    </div>
                    <div class="col-6">
                        <label class="form-label">Last Name</label>
                        <input type="text" class="form-control" placeholder="Doe">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" placeholder="name@example.com">
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" placeholder="••••••••">
                </div>
                <div class="mb-3">
                    <label class="form-label">Account Type</label>
                    <select class="form-select">
                        <option>Author / Publisher</option>
                        <option>Narrator</option>
                        <option>Studio Engineer</option>
                    </select>
                </div>
                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="terms" required>
                    <label class="form-check-label small" for="terms">
                        I agree to the <a href="#" class="text-decoration-none">Terms of Service</a> & <a href="#"
                            class="text-decoration-none">Privacy Policy</a>
                    </label>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Create Account</button>
            </form>

            <div class="text-center mt-4">
                <div class="position-relative mb-4">
                    <hr class="text-secondary opacity-25">
                    <span
                        class="position-absolute top-50 start-50 translate-middle bg-white px-2 text-muted small">OR</span>
                </div>
                <div class="d-flex gap-2 mb-4">
                    <button class="btn btn-outline-secondary w-50 py-2 fw-medium">
                        <i class="bi bi-google me-2"></i> Google
                    </button>
                    <button class="btn btn-outline-secondary w-50 py-2 fw-medium">
                        <i class="bi bi-facebook me-2 text-primary"></i> Facebook
                    </button>
                </div>
                <p class="small text-muted mb-0">Already have an account? <a href="login.html"
                        class="text-primary fw-bold text-decoration-none">Log In</a></p>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
